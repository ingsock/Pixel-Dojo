<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title desc">
  <title id="title">Dojo Master Concept D</title>
  <desc id="desc">A martial arts dojo master sitting in meditation with a floppy disk headband, a giant pencil bo-staff, and floating tech shurikens.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#1f2528" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Transparent background -->
  <circle cx="210" cy="260" r="160" fill="#ff6b57" opacity="0.1"/>

  <!-- Aura of 0s and 1s -->
  <g fill="#ff6b57" font-family="monospace" font-size="22" font-weight="bold" opacity="0.4">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 210 260" to="360 210 260" dur="20s" repeatCount="indefinite"/>
      <text x="180" y="80">010110</text>
      <text x="320" y="140" transform="rotate(45 320 140)">100101</text>
      <text x="380" y="270" transform="rotate(90 380 270)">011010</text>
      <text x="320" y="400" transform="rotate(135 320 400)">110011</text>
      <text x="180" y="460" transform="rotate(180 180 460)">001100</text>
      <text x="50" y="400" transform="rotate(225 50 400)">101010</text>
      <text x="10" y="270" transform="rotate(270 10 270)">010101</text>
      <text x="60" y="140" transform="rotate(315 60 140)">111001</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <!-- Speech bubble -->
    <path d="M270 60h90c18 0 32 14 32 32v60c0 18-14 32-32 32h-40l-30 40 5-40h-25c-18 0-32-14-32-32v-60c0-18 14-32 32-32z" fill="#fffaf0" stroke="#1f2528" stroke-width="5" stroke-linejoin="round"/>
    <g fill="#1f2528">
      <circle cx="295" cy="110" r="6">
        <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="315" cy="110" r="6">
        <animate attributeName="opacity" values="0;0;1;0" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="335" cy="110" r="6">
        <animate attributeName="opacity" values="0;0;0;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
    </g>
    

  </g>


  <g filter="url(#shadow)">
    <!-- Shadow under character -->
    <ellipse cx="200" cy="460" rx="140" ry="35" fill="#1f2528" opacity=".15"/>

    <!-- Legs -->
    <path d="M80 440c-20-30 10-60 60-65 40-4 80-4 120 0 50 5 80 35 60 65-15 25-60 30-120 30s-105-5-120-30z" fill="#3476d4" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>

    <!-- Body -->
    <path d="M130 380c-15-60 0-110 70-110s85 50 70 110z" fill="#3476d4" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>

    <!-- Lapel / Collar -->
    <path d="M160 270l40 60 40-60" fill="none" stroke="#fffaf0" stroke-width="8" stroke-linejoin="round"/>

    <!-- Belt -->
    <path d="M125 365c15 15 135 15 150 0v15c-15 15-135 15-150 0z" fill="#1f2528"/>
    <path d="M185 367h30v18h-30z" fill="#ff6b57" stroke="#1f2528" stroke-width="5" stroke-linejoin="round"/>
    <path d="M195 385l-10 30M205 385l10 30" stroke="#ff6b57" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Arm -->
    <path d="M135 285c-40 20-55 60-35 90 10 15 25 20 40 5 15-15 20-35 10-55-5-10-10-25-15-40z" fill="#3476d4" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>

    <!-- Right Arm -->
    <path d="M265 285c40 20 55 60 35 90-10 15-25 20-40 5-15-15-20-35-10-55 5-10 10-25 15-40z" fill="#3476d4" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>

    <!-- Laptop -->
    <path d="M120 385 L125 315 Q 128 300 145 300 L 255 300 Q 272 300 275 315 L 280 385 Z" fill="#fffaf0" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>
    <rect x="110" y="385" width="180" height="14" rx="5" fill="#1f2528"/>
    <rect x="113" y="385" width="174" height="4" fill="#3476d4" opacity="0.8"/>
    
    <!-- Laptop Screen -->
    <path d="M132 385 L136 320 Q 138 310 148 310 L 252 310 Q 262 310 264 320 L 268 385 Z" fill="#1f2528"/>
    
    <!-- Code on Screen -->
    <g font-family="monospace" font-size="8" font-weight="bold" fill="#31b67a">
      <text x="140" y="325">def dojo():</text>
      <text x="145" y="335"> yield 1</text>
      <text x="140" y="345">while True:</text>
      <text x="145" y="355"> train()</text>
      <text x="140" y="365" fill="#ffcf4a">&gt;</text>
      <rect x="146" y="358" width="4" height="8" fill="#ffcf4a">
        <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
    
    <!-- Graph on Screen -->
    <g fill="none" stroke="#ffcf4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Axes -->
      <path d="M 205 370 L 205 325 M 205 370 L 255 370" stroke="#fffaf0" stroke-width="1.5" opacity="0.5"/>
      <!-- Line graph -->
      <path d="M 210 365 L 225 340 L 235 350 L 250 330" />
      <!-- Animated point -->
      <circle cx="250" cy="330" r="2" fill="#ff6b57" stroke="none">
        <animate attributeName="r" values="2; 3.5; 2" dur="1.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Hands on Laptop -->
    <circle cx="120" cy="375" r="15" fill="#f4c49a" stroke="#1f2528" stroke-width="6"/>
    <circle cx="280" cy="375" r="15" fill="#f4c49a" stroke="#1f2528" stroke-width="6"/>

    <!-- Headband Tails (Behind Head) -->
    <path d="M135 170l-40 15 15 25 30-25z" fill="#ff6b57" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>
    <path d="M135 180l-25 30 15 15 25-30z" fill="#ff6b57" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>

    <!-- Ears -->
    <path d="M135 210c-15-10-25 5-15 20" fill="#f4c49a" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>
    <path d="M265 210c15-10 25 5 15 20" fill="#f4c49a" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>

    <!-- Head -->
    <circle cx="200" cy="200" r="75" fill="#f4c49a" stroke="#1f2528" stroke-width="6"/>

    <!-- Headband -->
    <path d="M125 160c15-10 135-10 150 0v20c-15-10-135-10-150 0z" fill="#ff6b57" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>
    <!-- Floppy disk on headband -->
    <rect x="188" y="152" width="24" height="18" rx="2" fill="#fffaf0" stroke="#1f2528" stroke-width="4"/>
    <rect x="194" y="152" width="12" height="8" fill="#1f2528"/>

    <!-- Eyes -->
    <path d="M165 190c10-8 20-8 30 0" fill="none" stroke="#1f2528" stroke-width="6" stroke-linecap="round"/>
    <path d="M205 190c10-8 20-8 30 0" fill="none" stroke="#1f2528" stroke-width="6" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M145 185c5-15 15-20 25-20 10 0 20 5 25 15-15-5-35 0-50 5z" fill="#ffffff" stroke="#1f2528" stroke-width="5" stroke-linejoin="round"/>
    <path d="M255 185c-5-15-15-20-25-20-10 0-20 5-25 15 15-5 35 0 50 5z" fill="#ffffff" stroke="#1f2528" stroke-width="5" stroke-linejoin="round"/>

    <!-- Beard -->
    <path d="M135 220c-10 40 15 80 65 95 50-15 75-55 65-95-20 20-110 20-130 0z" fill="#ffffff" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>
    <!-- Animated Mouth -->
    <ellipse cx="200" cy="222" rx="14" ry="2" fill="#1f2528">
      <animate attributeName="ry" values="2; 10; 2; 2; 12; 2" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="222; 226; 222; 222; 228; 222" dur="1.5s" repeatCount="indefinite" />
    </ellipse>

    <!-- Animated Mustache -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 0; 0 -6; 0 0" dur="1.5s" repeatCount="indefinite" />
      <!-- Left Mustache -->
      <path d="M160 215c15-10 35-10 40 0-15 10-35 10-40 0z" fill="#ffffff" stroke="#1f2528" stroke-width="5" stroke-linejoin="round"/>
      <!-- Right Mustache -->
      <path d="M240 215c-15-10-35-10-40 0 15 10 35 10 40 0z" fill="#ffffff" stroke="#1f2528" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <!-- Nose -->
    <circle cx="200" cy="205" r="10" fill="#f4c49a" stroke="#1f2528" stroke-width="5"/>

    <!-- Top Knot -->
    <path d="M185 130c-10-20 10-40 30-30 15 10 15 30 0 35-10 5-20 5-30-5z" fill="#ffffff" stroke="#1f2528" stroke-width="6" stroke-linejoin="round"/>
    <path d="M190 125l20 10" stroke="#1f2528" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
